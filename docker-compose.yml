services:
  planossauro-backend:
    build: .
    ports:
      - 80:80
    networks:
      - db_to_backend
    depends_on:
      planossauro-db:
        condition: service_healthy
    command: /bin/sh -c /app/migration.sh

  planossauro-db:
    image: mysql:latest
    restart: always
    networks:
      - db_to_backend
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_PORT: ${DB_PORT}
    volumes:
      - db_volume_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      timeout: 5s
      retries: 5

networks:
  db_to_backend:
    driver: bridge

volumes:
  db_volume_data:
