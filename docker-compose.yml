services:
  planossauro-backend:
    build: .
    ports:
      - 80:8080
    networks:
      - db_to_backend
    depends_on:
      planossauro-db:
        condition: service_healthy
    command: /bin/sh -c /app/start.sh
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  planossauro-db:
    image: mariadb:12.2.2
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - db_to_backend
    ports:
      - 3306:3306
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_PORT: ${DB_PORT}
    volumes:
      - db_volume_data:/var/lib/mariadb
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD}",
        ]
      timeout: 5s
      retries: 5

networks:
  db_to_backend:
    driver: bridge

volumes:
  db_volume_data:
